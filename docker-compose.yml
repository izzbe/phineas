services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: always
    environment:
      - POSTGRES_PASSWORD
      - POSTGRES_USER
      - POSTGRES_DB
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  web:
    command: ["uv", "run", "fastapi", "dev", "apps/api/src/api/main.py", "--host", "0.0.0.0", "--port", "80"]
    build:
      dockerfile: apps/api/Dockerfile
      context: .
    ports:
      - "80:80"
    environment:
      - POSTGRES_PASSWORD
      - POSTGRES_USER
      - POSTGRES_DB
      - POSTGRES_HOST=db
      - ANTHROPIC_API_KEY
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./apps/api
          target: app/apps/api
        - action: rebuild
          path: ./uv.lock
          target: app/uv.lock
volumes:
  pgdata: